<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>تست انتخاب فیش</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f4f8f5;
      color: #20543e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 18px;
      padding: 24px 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 21px;
    }

    p {
      line-height: 1.8;
      font-size: 14px;
      margin: 10px 0 20px;
    }

    .file-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 14px;
      border: 1px solid #9eb5a6;
      border-radius: 12px;
      background: #f8faf8;
      color: #20543e;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .file-picker:active {
      transform: scale(.99);
    }

    /*
      مهم:
      input واقعی است ولی با display:none مخفی نشده.
      این کار برای سازگاری بهتر با iOS WebView انجام شده.
    */
    #receiptFile {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
      opacity: 0;
    }

    .result {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: #f1f6f2;
      min-height: 50px;
      font-size: 14px;
      line-height: 1.8;
      word-break: break-word;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      margin-top: 18px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>📷 تست انتخاب تصویر</h2>

    <p>
      روی دکمه زیر بزنید و یک تصویر را از گالری انتخاب کنید.
      <br>
      بعد از انتخاب، نام فایل و تصویر باید همین‌جا نمایش داده شود.
    </p>

    <input
      id="receiptFile"
      type="file"
      accept="image/*"
      aria-label="انتخاب تصویر"
    >

    <label
      for="receiptFile"
      class="file-picker"
    >
      📷 انتخاب تصویر از گالری
    </label>

    <div id="result" class="result">
      هنوز تصویری انتخاب نشده است.
    </div>

    <img id="preview" alt="پیش‌نمایش تصویر">

  </div>

  <script>
    const tg =
      window.Telegram &&
      window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

    if (tg) {
      try {
        tg.ready();
        tg.expand();
      } catch (e) {}
    }

    const receiptFile = document.getElementById("receiptFile");
    const result = document.getElementById("result");
    const preview = document.getElementById("preview");

    receiptFile.addEventListener("change", function () {

      console.log("CHANGE EVENT");
      console.log("FILES:", this.files);
      console.log("LENGTH:", this.files ? this.files.length : 0);

      if (!this.files || this.files.length === 0) {

        result.textContent =
          "❌ فایل انتخاب نشد؛ input.files خالی است.";

        preview.style.display = "none";
        preview.removeAttribute("src");

        return;
      }

      const file = this.files[0];

      result.innerHTML =
        "✅ فایل با موفقیت انتخاب شد!<br><br>" +
        "نام فایل: " + file.name + "<br>" +
        "نوع فایل: " + file.type + "<br>" +
        "حجم: " + Math.round(file.size / 1024) + " KB";

      const reader = new FileReader();

      reader.onload = function (event) {
        preview.src = event.target.result;
        preview.style.display = "block";
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
