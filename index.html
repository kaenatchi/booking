<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رزرو آنلاین نوبت</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
            padding: 15px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h2 { text-align: center; color: #2abee8; margin-top: 0; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn {
            width: 100%;
            background-color: var(--tg-theme-button-color, #2abee8);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <h2>📅 ثبت و رزرو آنلاین نوبت</h2>
    
    <label>نام و نام خانوادگی:</label>
    <input type="text" id="fullName" placeholder="مثال: علی محمدی">

    <label>شماره همراه:</label>
    <input type="tel" id="phone" placeholder="۰۹۱۲XXXXXXX">

    <label>انتخاب سانس:</label>
    <select id="slotSelect">
        <option value="">در حال بارگذاری سانس‌ها...</option>
    </select>

    <button class="btn" onclick="submitBooking()">تأیید و ثبت نهایی رزرو</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // 🔴 اطلاعات خودت رو اینجا جایگزین کن:
    const SUPABASE_URL = "https://zcyzreweoipdtxhnjbrh.supabase.co/rest/v1/";
    const SUPABASE_KEY = "sb_publishable_HBSyPhhkkMLBz3YJAk_dYg_Ct9sF8EO";
    const BOT_TOKEN = "8903855446:AAGsv5BqmfuSUQugmP3GQ99ExOvMYoAONmg";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // بارگذاری سانس‌های آزاد از دیتابیس
    async function loadSlots() {
        const { data, error } = await supabase.from('slots').select('*');
        const select = document.getElementById('slotSelect');
        select.innerHTML = '<option value="">یک سانس را انتخاب کنید</option>';

        if (error) { alert('خطا در دریافت لیست سانس‌ها'); return; }

        data.forEach(slot => {
            const option = document.createElement('option');
            option.value = slot.id;
            if (slot.is_booked) {
                option.text = slot.slot_time + ' (تکمیل ظرفیت ❌)';
                option.disabled = true;
            } else {
                option.text = slot.slot_time;
            }
            select.appendChild(option);
        });
    }

    // ثبت رزرو و قفل‌کردن سانس
    async function submitBooking() {
        const name = document.getElementById('fullName').value;
        const phone = document.getElementById('phone').value;
        const slotId = document.getElementById('slotSelect').value;
        const slotText = document.getElementById('slotSelect').options[document.getElementById('slotSelect').selectedIndex].text;

        if (!name  !phone  !slotId) {
            alert('لطفاً تمامی فیلدها را پر کنید.');
            return;
        }

        // ۱. قفل کردن سانس در دیتابیس
        const { error } = await supabase.from('slots').update({ is_booked: true }).eq('id', slotId);

        if (error) {
            alert('خطا در ثبت نوبت. ممکن است این سانس قبلاً رزرو شده باشد.');
            return;
        }

        // ۲. ارسال پیام به تلگرام شما
        const chatId = tg.initDataUnsafe.user ? tg.
initDataUnsafe.user.id : '';
        const message = 🚨 **رزرو نوبت جدید!**\n\n👤 **نام:** ${name}\n📞 **تلفن:** ${phone}\n⏰ **سانس:** ${slotText};

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
        });

        alert('رزرو شما با موفقیت ثبت شد!');
        tg.close();
    }

    loadSlots();
</script>
</body>
</html>
