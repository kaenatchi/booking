<div id="kaen-loading">
  <div id="kaen-loading-card">
    <img
      id="kaen-loading-logo"
      src="https://i.ibb.co/hRBG6R6f/IMG-3856.jpg"
      alt="">
    <div id="kaen-loading-text">کائنات‌چی</div>
  </div>
</div>

<script>
/* =========================================================
   ORIGINAL SOURCE
   Exact Gist revision supplied by the user.
========================================================= */

const KAENATCHI_SOURCE =
"https://gist.githubusercontent.com/kaenatchi/fd2d9fb44b947c21865cddb24b67da14/raw/37e2baeaeafb61806bc5308cbbbce2b74dcf2af3/gistfile1.txt";


/* =========================================================
   LOAD ORIGINAL HOME.HTML WITHOUT REWRITING ITS LOGIC
========================================================= */

async function bootKaenatchi(){

  try{

    const response =
      await fetch(
        KAENATCHI_SOURCE,
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "KaenatChi source could not be loaded."
      );
    }

    const html =
      await response.text();

    const parser =
      new DOMParser();

    const doc =
      parser.parseFromString(
        html,
        "text/html"
      );


    /*
      Collect every original script
      before replacing the document.
    */

    const originalScripts =
      Array.from(
        doc.querySelectorAll(
          "script"
        )
      ).map(function(script){

        return {
          src:script.src || "",
          type:script.type || "",
          text:script.textContent || ""
        };

      });


    /*
      Remove scripts from cloned document.
      They will be executed manually
      in their original order.
    */

    doc
      .querySelectorAll("script")
      .forEach(function(script){
        script.remove();
      });


    /*
      Preserve original head and body.
    */

    document.head.innerHTML =
      doc.head.innerHTML;

    document.body.innerHTML =
      doc.body.innerHTML;


    /*
      Re-execute original scripts
      in their original order.
    */

    for(
      const item of originalScripts
    ){

      await new Promise(function(resolve){

        const script =
          document.createElement(
            "script"
          );

        if(item.type){
          script.type =
            item.type;
        }

        if(item.src){

          script.src =
            item.src;

          script.onload =
            resolve;

          script.onerror =
            resolve;

          document.body.appendChild(
            script
          );

        }else{

          script.textContent =
            item.text;

          document.body.appendChild(
            script
          );

          resolve();

        }

      });

    }


    /*
      Original DOMContentLoaded has already happened,
      so explicitly call the original CMS loader.
    */

    setTimeout(function(){

      try{

        if(
          typeof window.loadCMS ===
          "function"
        ){

          window.loadCMS();

        }

      }catch(error){

        console.error(
          "CMS startup:",
          error
        );

      }

    },80);


    /*
      Apply requested visual layer
      after original DOM exists.
    */

    setTimeout(
      applyKaenatchiChanges,
      180
    );


    /*
      CMS renders dynamically.
      Apply the visual layer again after
      dynamic content appears.
    */

    const observer =
      new MutationObserver(
        function(){

          applyKaenatchiChanges();

        }
      );

    observer.observe(
      document.body,
      {
        childList:true,
        subtree:true
      }
    );


  }catch(error){

    console.error(
      "KaenatChi boot error:",
      error
    );

    document.body.innerHTML = `
      <div style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:25px;
        background:#f6f0e4;
        direction:rtl;
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      ">
        <div style="
          width:min(100%,340px);
          padding:28px;
          text-align:center;
          border-radius:30px;
          background:rgba(255,255,255,.72);
          border:1px solid rgba(255,255,255,.92);
          box-shadow:
            0 18px 42px rgba(35,77,58,.15),
            inset 0 1px 1px rgba(255,255,255,.95);
          color:#234d3a;
        ">
          دریافت سامانه با خطا مواجه شد.
        </div>
      </div>
    `;

  }

}


/* =========================================================
   EMOJI REMOVAL
========================================================= */

function removeKaenatchiEmoji(){

  const emojiRegex =
    /(?:\p{Extended_Pictographic}|\uFE0F|\u200D|\u20E3)/gu;

  const walker =
    document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT
    );

  const nodes = [];

  let node;

  while(
    node = walker.nextNode()
  ){

    if(
      node.parentElement &&
      !node.parentElement.closest(
        "#kaen-loading"
      ) &&
      !node.parentElement.closest(
        "script"
      ) &&
      !node.parentElement.closest(
        "style"
      )
    ){

      nodes.push(node);

    }

  }

  nodes.forEach(function(textNode){

    textNode.nodeValue =
      textNode.nodeValue.replace(
        emojiRegex,
        ""
      );

  });


  /*
    Also clean visible attributes.
  */

  document
    .querySelectorAll(
      "[aria-label],[title]"
    )
    .forEach(function(element){

      ["aria-label","title"]
        .forEach(function(attribute){

          if(
            element.hasAttribute(
              attribute
            )
          ){

            element.setAttribute(
              attribute,
              element
                .getAttribute(attribute)
                .replace(
                  emojiRegex,
                  ""
                )
                .trim()
            );

          }

        });

    });

}


/* =========================================================
   HOME TEXT
========================================================= */

function fixHomeBrand(){

  const home =
    document.getElementById(
      "homeView"
    );

  if(!home) return;


  const miniBrand =
    home.querySelector(
      ".mini-brand"
    );

  if(miniBrand){

    miniBrand.style.display =
      "none";

  }


  const title =
    home.querySelector(
      ".hero h1"
    );

  if(title){

    title.textContent =
      "به کائنات‌چی خوش اومدید";

  }


  const description =
    home.querySelector(
      ".hero-description"
    );

  if(description){

    description.textContent =
      "خدمات تخصصی برای شناخت بهتر خود، آرامش ذهن و تجربه‌ای متفاوت از دنیای درون";

  }

}


/* =========================================================
   TOP RIGHT >
========================================================= */

let kaenHistory = [];

let kaenCurrentView =
  "homeView";


function installKaenViewHistory(){

  if(
    window.__kaenViewHistoryInstalled
  ){

    return;

  }

  window.__kaenViewHistoryInstalled =
    true;


  if(
    typeof window.showView !==
    "function"
  ){

    return;

  }


  const originalShowView =
    window.showView;


  window.showView =
    function(id){

      if(
        id &&
        id !== kaenCurrentView
      ){

        kaenHistory.push(
          kaenCurrentView
        );

        if(
          kaenHistory.length > 12
        ){

          kaenHistory.shift();

        }

      }

      kaenCurrentView =
        id || kaenCurrentView;


      originalShowView.apply(
        this,
        arguments
      );


      setTimeout(
        updateKaenTopBack,
        20
      );

    };


  window.__kaenOriginalShowView =
    originalShowView;

}


function kaenGoPrevious(){

  const previous =
    kaenHistory.pop();


  if(previous){

    kaenCurrentView =
      previous;

    if(
      typeof window.__kaenOriginalShowView ===
      "function"
    ){

      window.__kaenOriginalShowView(
        previous
      );

    }else{

      const target =
        document.getElementById(
          previous
        );

      if(target){

        document
          .querySelectorAll(".view")
          .forEach(function(view){

            view.classList.remove(
              "active"
            );

          });

        target.classList.add(
          "active"
        );

      }

    }

  }else{

    if(
      typeof window.goHome ===
      "function"
    ){

      window.goHome();

    }

  }


  setTimeout(
    updateKaenTopBack,
    20
  );

}


function updateKaenTopBack(){

  document
    .querySelectorAll(".topbar")
    .forEach(function(topbar){

      let button =
        topbar.querySelector(
          ".kaen-top-back"
        );


      if(!button){

        button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "kaen-top-back";

        button.textContent =
          ">";

        button.setAttribute(
          "aria-label",
          "بازگشت"
        );

        button.addEventListener(
          "click",
          function(event){

            event.preventDefault();
            event.stopPropagation();

            kaenGoPrevious();

          }
        );

        topbar.appendChild(
          button
        );

      }


      const active =
        topbar.closest(
          ".view.active"
        );

      if(active){

        button.style.display =
          active.id === "homeView"
            ? "none"
            : "flex";

      }

    });

}


/* =========================================================
   FILTER HELPER
========================================================= */

function createKaenFilters(
  viewId,
  listId,
  items,
  onSelect
){

  const view =
    document.getElementById(
      viewId
    );

  const list =
    document.getElementById(
      listId
    );

  if(!view || !list){

    return;

  }


  let wrap =
    view.querySelector(
      ".kaen-filter-wrap"
    );


  if(!wrap){

    wrap =
      document.createElement(
        "div"
      );

    wrap.className =
      "kaen-filter-wrap";

    list.parentNode.insertBefore(
      wrap,
      list
    );

  }


  const scroll =
    document.createElement(
      "div"
    );

  scroll.className =
    "kaen-filter-scroll";


  items.forEach(
    function(item,index){

      const button =
        document.createElement(
          "button"
        );

      button.type =
        "button";

      button.className =
        "filter-pill" +
        (
          index === 0
            ? " active"
            : ""
        );

      button.textContent =
        item;

      button.dataset.filter =
        item;

      button.addEventListener(
        "click",
        function(){

          scroll
            .querySelectorAll(
              ".filter-pill"
            )
            .forEach(
              function(pill){

                pill.classList.remove(
                  "active"
                );

              }
            );

          button.classList.add(
            "active"
          );

          onSelect(
            item
          );

        }
      );


      scroll.appendChild(
        button
      );


      if(
        index <
        items.length - 1
      ){

        const separator =
          document.createElement(
            "span"
          );

        separator.className =
          "filter-separator";

        separator.textContent =
          ">";

        scroll.appendChild(
          separator
        );

      }

    }
  );


  wrap.innerHTML =
    "";

  wrap.appendChild(
    scroll
  );

}

let kaenServiceFilter =
  "همه";


function getServiceCategory(
  row
){

  const category =
    value(
      row,
      "دسته"
    );

  if(category){

    return category
      .replace(
        /^[^\p{L}\p{N}]+/gu,
        ""
      )
      .trim();

  }


  const name =
    value(
      row,
      "نام خدمت"
    );

  return name
    .replace(
      /^[^\p{L}\p{N}]+/gu,
      ""
    )
    .trim();

}

function installServicesFilters(){

  if(
    !window.CMS ||
    !Array.isArray(
      CMS.services
    )
  ){

    return;

  }


  const rows =
    activeRows(
      CMS.services
    );


  const categories =
    [];


  rows.forEach(
    function(row){

      const category =
        getServiceCategory(
          row
        );

      if(
        category &&
        !categories.includes(
          category
        )
      ){

        categories.push(
          category
        );

      }

    }
  );


  /*
    Ensure the requested main categories
    remain available when CMS contains them.
  */

  [
    "انرژی‌خوانی",
    "شمع‌تراپی",
    "سایکوتراپی"
  ].forEach(
    function(name){

      if(
        rows.some(
          function(row){

            return (
              getServiceCategory(
                row
              ) === name ||
              value(
                row,
                "نام خدمت"
              )
              .includes(name)
            );

          }
        ) &&
        !categories.includes(
          name
        )
      ){

        categories.push(
          name
        );

      }

    }

  createKaenFilters(
    "servicesView",
    "servicesList",
    ["همه"].concat(
      categories
    ),
    function(filter){

      kaenServiceFilter =
        filter;

      renderKaenServices();

    }
  );


  renderKaenServices();

}

    activeRows(

  const categories = {};


  rows.forEach(
    function(row){

        value(
          row,
          "دسته"

        !categories[category]
      ){

        categories[category] =
          [];

      categories[category]
        .push(row);

  let visibleCategories =
    Object.keys(
      categories

    kaenFaqFilter !==

  */

  document
    .querySelectorAll(
      "button,a,.glass-card,.list-item,.companion-card,.faq-category,.detail-card"
    )
    .forEach(
      function(element){

        if(
          !element.classList.contains(
            "primary-booking"
          )
        ){

          element.style.boxShadow =
            getComputedStyle(
              element
            ).boxShadow === "none"
              ? "var(--kaen-shadow)"
              : "";

        }

      }
    );


  fixHomeBrand();

  fixKaenMenu();

  updateKaenTopBack();

}


/* =========================================================
   INSTALL EVERYTHING
========================================================= */

let kaenFiltersInstalled =
  false;


function applyKaenatchiChanges(){

  installKaenViewHistory();

  applyUniversalKaenVisual();


  /*
    Filters are installed only after CMS
    has returned data.
  */

  if(
    window.CMS &&
    Array.isArray(
      CMS.services
    )
  ){

    if(
      !document.querySelector(
        "#servicesView .kaen-filter-wrap"
      )
    ){

      installServicesFilters();

    }

  }


  if(
    window.CMS &&
    Array.isArray(
      CMS.courses
    )
  ){

    if(
      !document.querySelector(
        "#coursesView .kaen-filter-wrap"
      )
    ){

      installCoursesFilters();

    }

  }


  if(
    window.CMS &&
    Array.isArray(
      CMS.events
    )
  ){

    if(
      !document.querySelector(
        "#eventsView .kaen-filter-wrap"
      )
    ){

      installEventsFilters();

    }

  }


  if(
    window.CMS &&
    Array.isArray(
      CMS.faq
    )
  ){

    if(
      !document.querySelector(
        "#faqView .kaen-filter-wrap"
      )
    ){

      installFAQFilters();

    }

  }


  /*
    Keep filters synchronized after navigation.
  */

  if(
    window.CMS
  ){

    const active =
      document.querySelector(
        ".view.active"
      );

    if(active){

      if(
        active.id ===
        "servicesView"
      ){

        renderKaenServices();

      }

      if(
        active.id ===
        "coursesView"
      ){

        renderKaenCourses();

      }

      if(
        active.id ===
        "eventsView"
      ){

        renderKaenEvents();

      }

      if(
        active.id ===
        "faqView"
      ){

        renderKaenFAQ();

      }

    }

  }

}


/* =========================================================
   START
========================================================= */

bootKaenatchi();

</script>
