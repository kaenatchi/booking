<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f5efe3">
  <title>کائنات‌چی</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --cream:#f5efe3;
      --cream-2:#fbf7ef;
      --cream-3:#eee5d5;

      --green:#244d3b;
      --green-deep:#17382b;
      --green-mid:#35614d;
      --green-soft:#7e9d8b;

      --ink:#24352d;
      --muted:#718078;

      --glass:rgba(255,255,255,.43);
      --glass-strong:rgba(255,255,255,.62);
      --glass-clear:rgba(255,255,255,.24);

      --line:rgba(255,255,255,.72);
      --line-dark:rgba(36,77,59,.13);

      --shadow:
        0 20px 55px rgba(29,63,47,.12),
        0 5px 18px rgba(29,63,47,.07);

      --shadow-deep:
        0 28px 70px rgba(23,56,43,.18),
        0 10px 28px rgba(23,56,43,.10);

      --radius-xl:38px;
      --radius-lg:28px;
      --radius-md:22px;
      --radius-sm:17px;

      --ease:cubic-bezier(.22,.8,.24,1);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html{
      min-height:100%;
      background:var(--cream);
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 50% -5%,rgba(255,255,255,.95),transparent 34%),
        radial-gradient(circle at 0% 45%,rgba(113,150,127,.10),transparent 28%),
        radial-gradient(circle at 100% 30%,rgba(111,145,122,.08),transparent 28%),
        linear-gradient(180deg,var(--cream-2),var(--cream));
      color:var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      overflow-x:hidden;
    }

    button,
    a,
    input{
      font:inherit;
    }

    button{
      border:0;
      cursor:pointer;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      max-width:100%;
      display:block;
    }

    /* =========================================================
       BACKGROUND / BOTANICAL ATMOSPHERE
    ========================================================= */

    .ambient{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      overflow:hidden;
    }

    .ambient::before{
      content:"";
      position:absolute;
      width:420px;
      height:420px;
      border-radius:50%;
      right:-220px;
      top:180px;
      background:rgba(99,139,116,.11);
      filter:blur(75px);
    }

    .ambient::after{
      content:"";
      position:absolute;
      width:360px;
      height:360px;
      border-radius:50%;
      left:-200px;
      bottom:100px;
      background:rgba(117,153,131,.09);
      filter:blur(75px);
    }

    .branch{
      position:absolute;
      width:300px;
      height:420px;
      opacity:.50;
      transition:
        opacity .7s var(--ease),
        filter .7s var(--ease),
        transform .7s var(--ease);
    }

    .branch.left{
      left:-75px;
      top:115px;
      transform:rotate(-5deg);
    }

    .branch.right{
      right:-75px;
      top:115px;
      transform:scaleX(-1) rotate(-5deg);
    }

    .leaf{
      position:absolute;
      width:35px;
      height:16px;
      border-radius:100% 0 100% 0;
      background:
        linear-gradient(135deg,
          rgba(42,87,65,.46),
          rgba(109,145,122,.17));
      transform:rotate(-30deg);
      filter:blur(.2px);
      box-shadow:
        inset 2px 2px 4px rgba(255,255,255,.45),
        4px 6px 12px rgba(32,73,53,.08);
    }

    .stem{
      position:absolute;
      width:2px;
      height:360px;
      background:linear-gradient(
        180deg,
        transparent,
        rgba(42,87,65,.34),
        rgba(42,87,65,.12),
        transparent
      );
      border-radius:100%;
      transform:rotate(24deg);
      left:130px;
      top:20px;
    }

    .leaf.l1{left:72px;top:82px;transform:rotate(-46deg)}
    .leaf.l2{left:118px;top:115px;transform:rotate(20deg)}
    .leaf.l3{left:48px;top:157px;transform:rotate(-35deg)}
    .leaf.l4{left:123px;top:188px;transform:rotate(24deg)}
    .leaf.l5{left:67px;top:229px;transform:rotate(-42deg)}
    .leaf.l6{left:137px;top:264px;transform:rotate(23deg)}
    .leaf.l7{left:80px;top:310px;transform:rotate(-35deg)}
    .leaf.l8{left:150px;top:338px;transform:rotate(28deg)}

    /* =========================================================
       APP
    ========================================================= */

    #app{
      position:relative;
      z-index:1;
      width:100%;
      max-width:620px;
      min-height:100vh;
      margin:0 auto;
      padding:
        max(14px,env(safe-area-inset-top))
        16px
        max(34px,env(safe-area-inset-bottom));
    }

    .screen{
      position:relative;
      min-height:100vh;
      padding-bottom:30px;
    }

    /* =========================================================
       TOP NAV
    ========================================================= */

    .topbar{
      position:fixed;
      top:max(12px,env(safe-area-inset-top));
      left:50%;
      transform:translateX(-50%);
      width:min(calc(100% - 28px),590px);
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:space-between;
      direction:ltr;
      pointer-events:none;
    }

    .topbar>*{
      pointer-events:auto;
    }

    .glass-control{
      width:50px;
      height:50px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:var(--green);
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.78),
          rgba(255,255,255,.32)
        );
      border:1px solid rgba(255,255,255,.86);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.88),
        inset -1px -2px 5px rgba(35,74,55,.08),
        0 15px 30px rgba(25,59,43,.14);
      backdrop-filter:blur(22px) saturate(150%);
      -webkit-backdrop-filter:blur(22px) saturate(150%);
      transition:
        transform .22s var(--ease),
        box-shadow .22s var(--ease);
    }

    .glass-control:active{
      transform:scale(.91);
      box-shadow:
        inset 2px 2px 7px rgba(35,74,55,.12),
        0 7px 16px rgba(25,59,43,.10);
    }

    .glass-control svg{
      width:23px;
      height:23px;
    }

    .menu-button{
      position:relative;
    }

    .menu-button .hamburger{
      width:21px;
      height:15px;
      position:relative;
    }

    .hamburger span{
      position:absolute;
      left:0;
      width:21px;
      height:1.7px;
      border-radius:10px;
      background:var(--green);
      transition:.28s var(--ease);
    }

    .hamburger span:nth-child(1){top:0}
    .hamburger span:nth-child(2){top:6.5px}
    .hamburger span:nth-child(3){top:13px}

    .back-button{
      direction:ltr;
      font-size:0;
    }

    .back-button svg{
      transform:rotate(180deg);
    }

    .home-topbar .back-button{
      visibility:hidden;
      pointer-events:none;
    }

    /* =========================================================
       HOME HERO
    ========================================================= */

    .home-hero{
      position:relative;
      min-height:465px;
      margin:-16px -16px 0;
      padding:
        105px
        34px
        56px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }

    .hero-dome{
      position:absolute;
      top:55px;
      left:50%;
      transform:translateX(-50%);
      width:calc(100% - 26px);
      height:360px;
      border-radius:50% 50% 31% 31% / 47% 47% 20% 20%;
      background:
        radial-gradient(
          ellipse at 50% 18%,
          rgba(255,255,255,.82),
          rgba(255,255,255,.34) 45%,
          rgba(255,255,255,.12) 100%
        );
      border:1px solid rgba(255,255,255,.83);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.9),
        inset 0 -25px 50px rgba(66,103,82,.06),
        0 32px 70px rgba(38,76,57,.11);
      backdrop-filter:blur(18px) saturate(145%);
      -webkit-backdrop-filter:blur(18px) saturate(145%);
    }

    .hero-dome::before{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:inherit;
      border:1px solid rgba(255,255,255,.40);
      pointer-events:none;
    }

    .hero-dome::after{
      content:"";
      position:absolute;
      width:70%;
      height:45%;
      left:15%;
      top:-18%;
      border-radius:50%;
      background:rgba(255,255,255,.48);
      filter:blur(30px);
    }

    .hero-botanical{
      position:absolute;
      inset:40px 0 0;
      pointer-events:none;
      z-index:2;
    }

    .hero-branch{
      position:absolute;
      width:245px;
      height:330px;
      opacity:.78;
    }

    .hero-branch.left{
      left:-28px;
      top:16px;
      transform:rotate(-7deg);
    }

    .hero-branch.right{
      right:-28px;
      top:16px;
      transform:scaleX(-1) rotate(-7deg);
    }

    .hero-stem{
      position:absolute;
      width:2px;
      height:310px;
      left:122px;
      top:0;
      border-radius:50%;
      background:linear-gradient(
        180deg,
        transparent,
        rgba(38,83,61,.60),
        rgba(70,112,87,.32),
        transparent
      );
      transform:rotate(27deg);
    }

    .hero-leaf{
      position:absolute;
      width:45px;
      height:21px;
      border-radius:100% 0 100% 0;
      background:
        linear-gradient(
          135deg,
          rgba(37,83,61,.68),
          rgba(117,153,128,.28)
        );
      box-shadow:
        inset 3px 3px 5px rgba(255,255,255,.48),
        5px 8px 15px rgba(31,69,50,.11);
    }

    .hero-leaf::after{
      content:"";
      position:absolute;
      left:8px;
      top:9px;
      width:28px;
      height:1px;
      background:rgba(255,255,255,.30);
      transform:rotate(-13deg);
    }

    .hero-leaf.a{left:54px;top:67px;transform:rotate(-48deg)}
    .hero-leaf.b{left:110px;top:102px;transform:rotate(16deg)}
    .hero-leaf.c{left:30px;top:145px;transform:rotate(-38deg)}
    .hero-leaf.d{left:112px;top:179px;transform:rotate(24deg)}
    .hero-leaf.e{left:54px;top:223px;transform:rotate(-43deg)}
    .hero-leaf.f{left:127px;top:256px;transform:rotate(22deg)}

    .hero-content{
      position:relative;
      z-index:5;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .hero-logo{
      width:108px;
      height:108px;
      border-radius:50%;
      object-fit:cover;
      object-position:center;
      background:#fff;
      border:4px solid rgba(255,255,255,.75);
      box-shadow:
        0 16px 38px rgba(25,62,44,.15),
        inset 0 2px 5px rgba(255,255,255,.8);
      margin-bottom:18px;
    }

    .hero-brand{
      margin:0;
      color:var(--green-deep);
      font-size:27px;
      font-weight:760;
      letter-spacing:-.8px;
    }

    .hero-welcome{
      margin:16px 0 8px;
      color:var(--green);
      font-size:24px;
      font-weight:740;
      letter-spacing:-.6px;
    }

    .hero-tagline{
      max-width:300px;
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:2;
      font-weight:520;
    }

    .hero-light{
      position:absolute;
      width:190px;
      height:60px;
      bottom:40px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(255,255,255,.45);
      filter:blur(35px);
      z-index:3;
    }

    /* =========================================================
       GLASS ICONS
    ========================================================= */

    .icon-glass{
      position:relative;
      width:62px;
      height:62px;
      flex:0 0 62px;
      border-radius:22px;
      display:grid;
      place-items:center;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.82),
          rgba(255,255,255,.30)
        );
      border:1px solid rgba(255,255,255,.88);
      box-shadow:
        inset 2px 2px 0 rgba(255,255,255,.88),
        inset -3px -4px 9px rgba(37,77,57,.08),
        0 14px 28px rgba(31,70,50,.13);
      backdrop-filter:blur(18px) saturate(155%);
      -webkit-backdrop-filter:blur(18px) saturate(155%);
    }

    .icon-glass::before{
      content:"";
      position:absolute;
      width:60%;
      height:28%;
      top:5px;
      left:20%;
      border-radius:50%;
      background:rgba(255,255,255,.40);
      filter:blur(5px);
    }

    .icon-glass svg{
      position:relative;
      z-index:1;
      width:31px;
      height:31px;
      color:var(--green);
      stroke-width:1.55;
    }

    /* =========================================================
       HOME ACTIONS
    ========================================================= */

    .home-content{
      position:relative;
      z-index:4;
      padding-top:8px;
    }

    .primary-booking{
      position:relative;
      min-height:78px;
      width:100%;
      border-radius:28px;
      padding:11px 15px;
      display:flex;
      align-items:center;
      gap:14px;
      text-align:right;
      color:#fff;
      background:
        linear-gradient(
          145deg,
          rgba(46,91,70,.96),
          rgba(27,62,46,.96)
        );
      border:1px solid rgba(255,255,255,.27);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.23),
        inset -2px -4px 12px rgba(0,0,0,.10),
        0 24px 45px rgba(30,72,52,.20);
      overflow:hidden;
      transition:.25s var(--ease);
    }

    .primary-booking::before{
      content:"";
      position:absolute;
      width:180px;
      height:70px;
      left:-35px;
      top:-35px;
      border-radius:50%;
      background:rgba(255,255,255,.12);
      filter:blur(16px);
    }

    .primary-booking:active{
      transform:scale(.975);
    }

    .primary-booking .icon-glass{
      background:rgba(255,255,255,.14);
      border-color:rgba(255,255,255,.24);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.25),
        0 9px 18px rgba(0,0,0,.12);
    }

    .primary-booking .icon-glass svg{
      color:#fff;
    }

    .primary-booking-text{
      position:relative;
      z-index:1;
      flex:1;
    }

    .primary-booking-title{
      display:block;
      font-size:17px;
      font-weight:750;
      margin-bottom:3px;
    }

    .primary-booking-sub{
      display:block;
      font-size:12px;
      opacity:.72;
    }

    .primary-arrow{
      width:42px;
      height:42px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.11);
      border:1px solid rgba(255,255,255,.16);
    }

    .primary-arrow svg{
      width:18px;
      height:18px;
      color:#fff;
    }

    .section-gap{
      height:15px;
    }

    .section-title{
      margin:27px 5px 12px;
      color:var(--green-deep);
      font-size:15px;
      font-weight:740;
      display:flex;
      align-items:center;
      gap:9px;
    }

    .section-title::before{
      content:"";
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--green);
      box-shadow:0 0 0 5px rgba(36,77,59,.08);
    }

    .glass-list{
      display:flex;
      flex-direction:column;
      gap:11px;
    }

    .glass-card{
      position:relative;
      width:100%;
      min-height:82px;
      padding:10px;
      border-radius:25px;
      display:flex;
      align-items:center;
      gap:13px;
      text-align:right;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.68),
          rgba(255,255,255,.30)
        );
      border:1px solid rgba(255,255,255,.82);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.82),
        inset -2px -3px 8px rgba(38,76,57,.045),
        var(--shadow);
      backdrop-filter:blur(21px) saturate(145%);
      -webkit-backdrop-filter:blur(21px) saturate(145%);
      transition:.25s var(--ease);
      overflow:hidden;
    }

    .glass-card::after{
      content:"";
      position:absolute;
      width:80px;
      height:80px;
      left:-35px;
      top:-45px;
      border-radius:50%;
      background:rgba(255,255,255,.34);
      filter:blur(15px);
    }

    .glass-card:active{
      transform:scale(.975);
      box-shadow:
        inset 2px 2px 7px rgba(37,77,57,.07),
        0 9px 20px rgba(31,70,50,.09);
    }

    .card-copy{
      flex:1;
      min-width:0;
      position:relative;
      z-index:2;
    }

    .card-title{
      color:var(--green-deep);
      font-size:15px;
      font-weight:730;
      margin-bottom:5px;
    }

    .card-sub{
      color:var(--muted);
      font-size:12px;
      line-height:1.8;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .chevron{
      width:38px;
      height:38px;
      border-radius:50%;
      display:grid;
      place-items:center;
      flex:0 0 38px;
      background:rgba(255,255,255,.35);
      border:1px solid rgba(255,255,255,.66);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.7),
        0 7px 16px rgba(35,73,54,.08);
      position:relative;
      z-index:2;
    }

    .chevron svg{
      width:17px;
      height:17px;
      color:var(--green);
    }

    /* =========================================================
       TWO COLUMN CARDS
    ========================================================= */

    .two-column{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:11px;
    }

    .square-card{
      min-height:146px;
      padding:13px;
      border-radius:27px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      align-items:flex-start;
      text-align:right;
    }

    .square-card .icon-glass{
      width:58px;
      height:58px;
      flex-basis:58px;
      border-radius:20px;
    }

    .square-card .card-title{
      margin-top:15px;
      margin-bottom:0;
    }

    /* =========================================================
       INNER PAGES
    ========================================================= */

    .inner-screen{
      padding-top:82px;
    }

    .inner-head{
      padding:14px 4px 20px;
      text-align:right;
    }

    .inner-head .mini-logo{
      width:58px;
      height:58px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.8);
      box-shadow:
        0 10px 24px rgba(28,65,47,.13),
        inset 1px 1px 0 rgba(255,255,255,.8);
      margin-bottom:14px;
    }

    .inner-title{
      margin:0;
      color:var(--green-deep);
      font-size:25px;
      font-weight:780;
      letter-spacing:-.5px;
    }

    .inner-subtitle{
      margin:7px 0 0;
      color:var(--muted);
      font-size:13px;
      line-height:1.9;
    }

    /* =========================================================
       GLASS FILTER / SEGMENTED NAV
    ========================================================= */

    .filter-shell{
      position:sticky;
      top:75px;
      z-index:50;
      margin:0 0 16px;
      padding:5px;
      border-radius:22px;
      background:rgba(255,255,255,.30);
      border:1px solid rgba(255,255,255,.66);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.68),
        0 14px 30px rgba(30,69,50,.08);
      backdrop-filter:blur(25px) saturate(155%);
      -webkit-backdrop-filter:blur(25px) saturate(155%);
      overflow-x:auto;
      scrollbar-width:none;
    }

    .filter-shell::-webkit-scrollbar{
      display:none;
    }

    .filter-row{
      display:flex;
      gap:5px;
      min-width:max-content;
    }

    .filter-button{
      position:relative;
      min-height:44px;
      padding:0 16px;
      border-radius:17px;
      color:var(--green-mid);
      background:transparent;
      white-space:nowrap;
      font-size:12px;
      font-weight:650;
      transition:.25s var(--ease);
    }

    .filter-button.active{
      color:#fff;
      background:
        linear-gradient(
          145deg,
          rgba(49,96,73,.97),
          rgba(29,66,49,.97)
        );
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.22),
        0 9px 20px rgba(30,70,50,.18);
    }

    /* =========================================================
       SERVICE HERO IMAGE
    ========================================================= */

    .service-visual{
      position:relative;
      height:265px;
      margin:4px 0 18px;
      border-radius:36px;
      overflow:hidden;
      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(255,255,255,.90),
          rgba(220,232,223,.82) 42%,
          rgba(154,180,160,.58)
        );
      border:1px solid rgba(255,255,255,.85);
      box-shadow:var(--shadow-deep);
    }

    .service-visual img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .service-visual::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.02) 15%,
          rgba(23,56,43,.05) 55%,
          rgba(23,56,43,.48) 100%
        );
    }

    .service-visual-fallback{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
    }

    .visual-orbit{
      width:130px;
      height:130px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.75);
      background:rgba(255,255,255,.24);
      box-shadow:
        inset 3px 3px 12px rgba(255,255,255,.6),
        inset -5px -7px 14px rgba(40,78,58,.08),
        0 22px 45px rgba(32,73,52,.15);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      display:grid;
      place-items:center;
    }

    .visual-orbit svg{
      width:64px;
      height:64px;
      color:var(--green);
      stroke-width:1.2;
    }

    .visual-label{
      position:absolute;
      z-index:3;
      right:17px;
      bottom:17px;
      left:17px;
      min-height:63px;
      padding:11px 14px;
      border-radius:22px;
      display:flex;
      align-items:center;
      gap:10px;
      color:#fff;
      background:rgba(21,53,39,.43);
      border:1px solid rgba(255,255,255,.25);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.18),
        0 15px 28px rgba(20,52,37,.18);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }

    .visual-label strong{
      font-size:16px;
      font-weight:730;
    }

    /* =========================================================
       DETAIL CONTENT
    ========================================================= */

    .content-glass{
      padding:20px;
      border-radius:29px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.62),
          rgba(255,255,255,.28)
        );
      border:1px solid rgba(255,255,255,.78);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.82),
        var(--shadow);
      backdrop-filter:blur(20px) saturate(140%);
      -webkit-backdrop-filter:blur(20px) saturate(140%);
    }

    .content-glass h3{
      color:var(--green-deep);
      font-size:16px;
      margin:0 0 10px;
    }

    .content-text{
      white-space:pre-line;
      color:#53635b;
      font-size:13px;
      line-height:2.15;
    }

    .price-row{
      margin-top:16px;
      padding:12px 14px;
      border-radius:18px;
      background:rgba(255,255,255,.36);
      border:1px solid rgba(255,255,255,.64);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .price-label{
      color:var(--muted);
      font-size:12px;
    }

    .price-value{
      color:var(--green-deep);
      font-size:15px;
      font-weight:760;
    }

    /* =========================================================
       BOOKING BUTTON INTERNAL
    ========================================================= */

    .booking-area{
      margin:17px 0;
    }

    .booking-glass{
      position:relative;
      width:100%;
      min-height:68px;
      padding:9px 11px;
      border-radius:25px;
      display:flex;
      align-items:center;
      gap:12px;
      color:#fff;
      background:
        linear-gradient(
          145deg,
          rgba(47,91,69,.96),
          rgba(24,59,43,.98)
        );
      border:1px solid rgba(255,255,255,.27);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.22),
        0 20px 40px rgba(27,66,47,.18);
      overflow:hidden;
      transition:.25s var(--ease);
    }

    .booking-glass:active{
      transform:scale(.975);
    }

    .booking-glass .icon-glass{
      width:50px;
      height:50px;
      flex-basis:50px;
      border-radius:18px;
      background:rgba(255,255,255,.13);
      border-color:rgba(255,255,255,.22);
      box-shadow:inset 1px 1px 0 rgba(255,255,255,.22);
    }

    .booking-glass .icon-glass svg{
      color:#fff;
      width:26px;
      height:26px;
    }

    .booking-glass strong{
      flex:1;
      text-align:right;
      font-size:15px;
      font-weight:730;
    }

    .booking-glass .arrow-white{
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:rgba(255,255,255,.11);
    }

    .arrow-white svg{
      width:17px;
      height:17px;
      color:#fff;
    }

    /* =========================================================
       FAQ
    ========================================================= */

    .faq-category{
      overflow:hidden;
    }

    .faq-category-head{
      min-height:76px;
    }

    .faq-category-head .icon-glass{
      width:55px;
      height:55px;
      flex-basis:55px;
      border-radius:19px;
    }

    .faq-category-body{
      display:none;
      padding:0 10px 10px;
    }

    .faq-category.open .faq-category-body{
      display:block;
      animation:fadeDown .28s var(--ease);
    }

    @keyframes fadeDown{
      from{
        opacity:0;
        transform:translateY(-5px);
      }
      to{
        opacity:1;
        transform:none;
      }
    }

    .faq-question{
      margin-top:8px;
      border-radius:19px;
      background:rgba(255,255,255,.30);
      border:1px solid rgba(255,255,255,.55);
      overflow:hidden;
    }

    .faq-q{
      width:100%;
      min-height:57px;
      padding:12px 13px;
      display:flex;
      align-items:center;
      gap:10px;
      background:transparent;
      color:var(--green-deep);
      text-align:right;
      font-size:12.5px;
      font-weight:650;
    }

    .faq-q span:first-child{
      flex:1;
    }

    .faq-q svg{
      width:17px;
      height:17px;
      color:var(--green);
      transition:.25s var(--ease);
    }

    .faq-question.open .faq-q svg{
      transform:rotate(180deg);
    }

    .faq-answer{
      display:none;
      padding:0 13px 14px;
      color:var(--muted);
      font-size:12px;
      line-height:2;
      white-space:pre-line;
    }

    .faq-question.open .faq-answer{
      display:block;
    }

    /* =========================================================
       COURSES / EVENTS
    ========================================================= */

    .status-pill{
      display:inline-flex;
      align-items:center;
      min-height:27px;
      padding:0 10px;
      border-radius:100px;
      color:var(--green);
      background:rgba(126,157,139,.13);
      border:1px solid rgba(126,157,139,.16);
      font-size:10px;
      font-weight:700;
      margin-top:8px;
    }

    .bullet-list{
      margin:10px 0 0;
      padding:0 18px 0 0;
      color:var(--muted);
      line-height:2.05;
      font-size:12.5px;
    }

    .meta-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:9px;
      margin-top:15px;
    }

    .meta-box{
      padding:12px;
      border-radius:18px;
      background:rgba(255,255,255,.32);
      border:1px solid rgba(255,255,255,.58);
    }

    .meta-label{
      color:var(--muted);
      font-size:10px;
      margin-bottom:4px;
    }

    .meta-value{
      color:var(--green-deep);
      font-size:12px;
      font-weight:680;
      line-height:1.7;
    }

    /* =========================================================
       CONTACT
    ========================================================= */

    .contact-card{
      min-height:74px;
    }

    .contact-value{
      color:var(--muted);
      font-size:11px;
      direction:ltr;
      text-align:right;
    }

    /* =========================================================
       DRAWER
    ========================================================= */

    .drawer-overlay{
      position:fixed;
      inset:0;
      z-index:150;
      background:rgba(23,49,37,.18);
      opacity:0;
      visibility:hidden;
      transition:.32s var(--ease);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
    }

    .drawer-overlay.open{
      opacity:1;
      visibility:visible;
    }

    .drawer{
      position:absolute;
      top:0;
      left:0;
      bottom:0;
      width:min(86vw,390px);
      padding:
        max(24px,env(safe-area-inset-top))
        18px
        max(25px,env(safe-area-inset-bottom));
      background:
        linear-gradient(
          150deg,
          rgba(255,255,255,.76),
          rgba(247,241,229,.66)
        );
      border-right:1px solid rgba(255,255,255,.82);
      border-radius:0 34px 34px 0;
      box-shadow:
        20px 0 70px rgba(22,58,41,.18),
        inset -1px 0 rgba(255,255,255,.65);
      backdrop-filter:blur(30px) saturate(155%);
      -webkit-backdrop-filter:blur(30px) saturate(155%);
      transform:translateX(-105%);
      transition:.38s var(--ease);
      overflow-y:auto;
    }

    .drawer-overlay.open .drawer{
      transform:translateX(0);
    }

    .drawer-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:23px;
    }

    .drawer-logo{
      width:55px;
      height:55px;
      object-fit:cover;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.8);
      box-shadow:0 10px 24px rgba(28,65,47,.13);
    }

    .drawer-close{
      width:47px;
      height:47px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.42);
      border:1px solid rgba(255,255,255,.75);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.8),
        0 9px 20px rgba(29,67,48,.10);
    }

    .drawer-close svg{
      width:20px;
      height:20px;
      color:var(--green);
    }

    .drawer-title{
      color:var(--green-deep);
      font-size:21px;
      font-weight:760;
      margin-bottom:5px;
    }

    .drawer-sub{
      color:var(--muted);
      font-size:11px;
      line-height:1.8;
      margin-bottom:18px;
    }

    .drawer-item{
      width:100%;
      min-height:65px;
      margin-bottom:8px;
      padding:7px;
      border-radius:22px;
      display:flex;
      align-items:center;
      gap:11px;
      background:rgba(255,255,255,.33);
      border:1px solid rgba(255,255,255,.58);
      box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.65),
        0 8px 20px rgba(28,65,47,.055);
      color:var(--green-deep);
      text-align:right;
    }

    .drawer-item .icon-glass{
      width:50px;
      height:50px;
      flex-basis:50px;
      border-radius:17px;
    }

    .drawer-item span{
      flex:1;
      font-size:13px;
      font-weight:680;
    }

    /* =========================================================
       SHEET
    ========================================================= */

    .sheet-overlay{
      position:fixed;
      inset:0;
      z-index:200;
      background:rgba(17,42,30,.20);
      opacity:0;
      visibility:hidden;
      transition:.3s var(--ease);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
    }

    .sheet-overlay.open{
      opacity:1;
      visibility:visible;
    }

    .sheet{
      position:absolute;
      left:8px;
      right:8px;
      bottom:8px;
      max-height:82vh;
      overflow-y:auto;
      padding:10px 17px 22px;
      border-radius:34px;
      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.78),
          rgba(248,243,232,.70)
        );
      border:1px solid rgba(255,255,255,.88);
      box-shadow:
        0 -15px 65px rgba(23,57,40,.20),
        inset 1px 1px 0 rgba(255,255,255,.9);
      backdrop-filter:blur(30px) saturate(150%);
      -webkit-backdrop-filter:blur(30px) saturate(150%);
      transform:translateY(110%);
      transition:.42s var(--ease);
    }

    .sheet-overlay.open .sheet{
      transform:translateY(0);
    }

    .sheet-handle{
      width:42px;
      height:5px;
      border-radius:100px;
      background:rgba(36,77,59,.18);
      margin:3px auto 20px;
    }

    .sheet-title{
      color:var(--green-deep);
      font-size:19px;
      font-weight:760;
      margin-bottom:16px;
    }

    .sheet-list{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .sheet-item{
      min-height:62px;
      padding:8px 10px;
      border-radius:21px;
      display:flex;
      align-items:center;
      gap:11px;
      background:rgba(255,255,255,.36);
      border:1px solid rgba(255,255,255,.62);
      box-shadow:inset 1px 1px 0 rgba(255,255,255,.7);
    }

    .sheet-item .icon-glass{
      width:47px;
      height:47px;
      flex-basis:47px;
      border-radius:16px;
    }

    .sheet-item strong{
      color:var(--green-deep);
      font-size:13px;
    }

    .sheet-item small{
      display:block;
      color:var(--muted);
      font-size:10px;
      margin-top:3px;
    }

    /* =========================================================
       EMPTY / LOADING
    ========================================================= */

    .loading{
      min-height:180px;
      display:grid;
      place-items:center;
      color:var(--muted);
      font-size:12px;
    }

    .loader{
      width:38px;
      height:38px;
      border-radius:50%;
      border:2px solid rgba(36,77,59,.10);
      border-top-color:var(--green);
      animation:spin .8s linear infinite;
      margin:0 auto 12px;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    .empty{
      padding:25px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
      line-height:2;
      border-radius:25px;
      background:rgba(255,255,255,.28);
      border:1px solid rgba(255,255,255,.54);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    .footer{
      position:relative;
      z-index:4;
      margin:42px 4px 4px;
      padding:22px 15px 10px;
      color:rgba(83,99,91,.72);
      font-size:9.5px;
      line-height:2;
      text-align:center;
    }

    .footer-line{
      width:42px;
      height:1px;
      background:rgba(36,77,59,.18);
      margin:0 auto 13px;
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media(max-width:380px){
      #app{
        padding-left:12px;
        padding-right:12px;
      }

      .home-hero{
        margin-left:-12px;
        margin-right:-12px;
      }

      .hero-brand{
        font-size:24px;
      }

      .hero-welcome{
        font-size:21px;
      }

      .two-column{
        gap:8px;
      }

      .filter-button{
        padding:0 13px;
      }
    }

    @media(min-width:621px){
      body{
        padding:0 20px;
      }

      #app{
        box-shadow:
          0 0 100px rgba(34,70,51,.06);
      }
    }

    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media(prefers-reduced-motion:reduce){
      *,
      *::before,
      *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
      }
    }
  </style>
</head>

    /* =========================================================
       HELPERS
    ========================================================= */

    function esc(value){
      return String(value ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function field(row, keys){
      for(const key of keys){
        if(row && row[key] !== undefined && row[key] !== null){
          return row[key];
        }
      }
      return '';
    }

    function active(row){
      const value = String(
        field(row,['فعال','active','Active'])
      ).trim().toLowerCase();

      return [
        'بله',
        'yes',
        'true',
        '1',
        'فعال',
        'active'
      ].includes(value);
    }

    function settingsObject(){
      const out = {};

      (CMS.settings || []).forEach(row=>{
        const key = String(
          field(row,['کلید','key'])
        ).trim();

        const value = field(row,['مقدار','value']);

        if(key){
          out[key] = value;
        }
      });

      return out;
    }

    function iconBox(icon){
      return `<div class="icon-glass">${ICONS[icon] || ICONS.sparkle}</div>`;
    }

    function cardArrow(){
      return `<div class="chevron">${ICONS.arrow}</div>`;
    }

    function openExternal(url){
      if(!url) return;

      try{
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        document.body.appendChild(a);
        a.click();
        a.remove();
      }catch(e){
        window.location.href = url;
      }
    }

    function go(view, data){
      if(currentView !== view){
        viewStack.push({
          view:currentView,
          data:window.__viewData || null
        });
      }

      currentView = view;
      window.__viewData = data || null;

      closeDrawer();
      closeSheet();

      render();
      window.scrollTo({
        top:0,
        behavior:'smooth'
      });
    }

    function back(){
      if(viewStack.length){
        const previous = viewStack.pop();

        currentView = previous.view;
        window.__viewData = previous.data || null;

        render();

        window.scrollTo({
          top:0,
          behavior:'smooth'
        });

        return;
      }

      goHome();
    }

    function goHome(){
      currentView = 'home';
      window.__viewData = null;
      viewStack = [];

      closeDrawer();
      closeSheet();

      render();

      window.scrollTo({
        top:0,
        behavior:'smooth'
      });
    }

    function serviceCategory(service){

      const category = String(
        field(service,['دسته','category'])
      ).trim();

      if(category === 'انرژی‌خوانی'){
        return 'energy';
      }

      if(category === 'شمع‌تراپی'){
        return 'candle';
      }

      if(category === 'سایکوتراپی'){
        return 'mind';
      }

      return 'other';
    }

    function serviceIcon(service){

      const category = serviceCategory(service);

      if(category === 'energy'){
        return 'lotus';
      }

      if(category === 'candle'){

    const FAQ_ICON_MAP = {
      'دریافت نوبت':'calendar',
      'پرداخت':'sparkle',
      'خدمات':'lotus',
      'پشتیبانی':'chat',
      'همراهان کائنات‌چی':'crown',

    function faqCategoryName(item){
      return String(
        field(item,['دسته','category']) || 'عمومی'
      ).trim();
    }

    function renderFAQ(){

      const rows = (CMS.faq || []).filter(active);

      const groups = {};

      rows.forEach(row=>{
        const category = faqCategoryName(row);

        if(!groups[category]){
          groups[category] = [];
        }

        groups[category].push(row);
      });

      const preferredOrder = [
        'دریافت نوبت',
        'پرداخت',
        'خدمات',
        'پشتیبانی',
        'همراهان کائنات‌چی',
        'عمومی'
      ];

      const categories = Object.keys(groups).sort((a,b)=>{
        const aa = preferredOrder.indexOf(a);
        const bb = preferredOrder.indexOf(b);

        if(aa === -1 && bb === -1) return a.localeCompare(b,'fa');
        if(aa === -1) return 1;
        if(bb === -1) return -1;

        return aa-bb;
      });

      document.getElementById('app').innerHTML =
        innerShell(`

          ${innerHeader(
            'سؤالات متداول',
            'موضوع موردنظر را انتخاب کنید و پاسخ پرسش‌ها را ببینید.'
          )}

          <div class="filter-shell">
            <div class="filter-row">

              <button
                class="filter-button active"
                type="button"
                onclick="faqScrollTo('all')"
              >
                همه
              </button>

              ${categories.map(category=>`
                <button
                  class="filter-button"
                  type="button"
                  onclick="faqScrollTo('${encodeURIComponent(category)}')"
                >
                  ${esc(category)}
                </button>
              `).join('')}

            </div>
          </div>

          <div class="glass-list">

            ${
              categories.length
              ? categories.map(category=>{

                  const questions =
                    groups[category];

                  const icon =
                    FAQ_ICON_MAP[category] || 'question';

                  return `

                    <section
                      class="glass-card faq-category"
                      id="faq-${encodeURIComponent(category)}"
                    >

                      <button
                        class="glass-card faq-category-head"
                        type="button"
                        onclick="toggleFaqCategory(this)"
                      >

                        ${iconBox(icon)}

                        <span class="card-copy">
                          <span class="card-title">
                            ${esc(category)}
                          </span>
                          <span class="card-sub">
                            ${questions.length} پرسش
                          </span>
                        </span>

                        <div class="chevron">
                          ${ICONS.chevronDown}
                        </div>

                      </button>

                      <div class="faq-category-body">

                        ${questions.map((q,index)=>`

                          <div
                            class="faq-question"
                            data-faq="${index}"
                          >

                            <button
                              class="faq-q"
                              type="button"
                              onclick="toggleFaqQuestion(this)"
                            >

                              <span>
                                ${esc(field(q,['سؤال','question']))}
                              </span>

                              ${ICONS.chevronDown}

                            </button>

                            <div class="faq-answer">
                              ${esc(field(q,['پاسخ','answer']))}
                            </div>

                          </div>

                        `).join('')}

                      </div>

                    </section>

                  `;
                }).join('')
              : `
                <div class="empty">
                  هنوز پرسشی در این بخش ثبت نشده است.
                </div>
              `
            }

          </div>

        `);
    }

    function toggleFaqCategory(button){

      const category =
        button.closest('.faq-category');

      category.classList.toggle('open');
    }

    function toggleFaqQuestion(button){

      const question =
        button.closest('.faq-question');

      question.classList.toggle('open');
    }

    function faqScrollTo(category){

      if(category === 'all'){
        window.scrollTo({
          top:0,
          behavior:'smooth'
        });
        return;
      }

      const id =
        'faq-' + category;

      const el =
        document.getElementById(id);

      if(el){
        el.classList.add('open');

        el.scrollIntoView({
          behavior:'smooth',
          block:'start'
        });
      }
    }

      }

      if(currentView === 'courses'){
        renderCourses();
        return;
      }

      if(currentView === 'courseDetail'){
        const data = window.__viewData || {};
        document.getElementById('app').innerHTML =
          courseDetail(data.item);
        return;
      }

      if(currentView === 'events'){
        renderEvents();
        return;
      }

      if(currentView === 'eventDetail'){
        const data = window.__viewData || {};
        document.getElementById('app').innerHTML =
          eventDetail(data.item);
        return;
      }

      if(currentView === 'faq'){
        renderFAQ();
        return;
      }

      if(currentView === 'contact'){
        renderContact();
        return;
      }

      if(currentView === 'hours'){
        renderHours();
        return;
      }

      if(currentView === 'vip'){
        renderVIP();
        return;
      }

      goHome();
    }

    /* =========================================================
       CMS
    ========================================================= */

    async function loadCMS(){

      try{

        const response =
          await fetch(
            CMS_URL + '?action=getMiniAppData&t=' + Date.now(),
            {
              method:'GET',
              cache:'no-store'
            }
          );

        let data =
          await response.json();

        /*
          بعضی نسخه‌های Apps Script ممکن است JSON
          را به‌صورت string داخل JSON برگردانند.
        */

        if(typeof data === 'string'){
          try{
            data = JSON.parse(data);
          }catch(e){}
        }

        if(data && data.success === false){
          throw new Error(
            data.message || 'CMS error'
          );
        }

        CMS = {
          services:
            Array.isArray(data.services)
              ? data.services
              : [],

          courses:
            Array.isArray(data.courses)
              ? data.courses
              : [],

          events:
            Array.isArray(data.events)
              ? data.events
              : [],

          faq:
            Array.isArray(data.faq)
              ? data.faq
              : [],

          pages:
            Array.isArray(data.pages)
              ? data.pages
              : [],

          settings:
            Array.isArray(data.settings)
              ? data.settings
              : []
        };

        buildDrawer();
        render();

      }catch(error){

        console.error(
          'CMS loading error:',
          error
        );

        CMS = {
          services:[],
          courses:[],
          events:[],
          faq:[],
          pages:[],
          settings:[]
        };

        buildDrawer();
        render();

      }
    }

    /* =========================================================
       INITIALIZE
    ========================================================= */

    buildDrawer();
    render();
    loadCMS();

  </script>
